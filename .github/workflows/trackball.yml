name: roBa trackball
run-name: roBa trackball ${{ inputs.cpi }} CPI (${{ inputs.request }})
on:
  workflow_dispatch:
    inputs:
      cpi:
        description: Target CPI (200 to 3200 in steps of 50)
        type: string
        required: true
        default: '650'
      request:
        description: Build request ID (optional)
        type: string
        default: manual

permissions:
  contents: read

jobs:
  right:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set trackball sensitivity
        env:
          TARGET_CPI: ${{ inputs.cpi }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from math import gcd
          from pathlib import Path

          target = os.environ['TARGET_CPI']
          if not re.fullmatch(r'[0-9]{3,4}', target):
              raise SystemExit('Invalid CPI')
          cpi = int(target)
          if target != str(cpi) or not 200 <= cpi <= 3200 or cpi % 50:
              raise SystemExit('Invalid CPI')

          sensor_cpi = ((cpi + 100) // 200) * 200
          common = gcd(cpi, sensor_cpi)
          multiplier, divisor = cpi // common, sensor_cpi // common
          shield = Path('boards/shields/roBa')
          conf = shield / 'roBa_R.conf'
          conf_text = conf.read_text()
          if not re.search(r'^CONFIG_PMW3610_CPI_DIVIDOR=1\s*$', conf_text, re.M):
              raise SystemExit('Expected the standard roBa CPI divisor of 1')
          contents, count = re.subn(r'^CONFIG_PMW3610_CPI=\d+$',
                                    f'CONFIG_PMW3610_CPI={sensor_cpi}', conf_text, flags=re.M)
          if count != 1:
              raise SystemExit('Expected exactly one normal CPI setting')
          conf.write_text(contents)

          if cpi != sensor_cpi:
              overlay = shield / 'roBa_R.overlay'
              contents = overlay.read_text()
              if 'input-processors' in contents or contents.count('trackball_listener {') != 1:
                  raise SystemExit('Trackball overlay has changed. Check its input processors.')
              overlay.write_text('#include <input/processors.dtsi>\n' + contents.replace(
                  'trackball_listener {',
                  f'trackball_listener {{\n        input-processors = <&zip_xy_scaler {multiplier} {divisor}>;'))

          with open(os.environ['GITHUB_ENV'], 'a') as out:
              print(f'SENSOR_CPI={sensor_cpi}\nCPI_MULTIPLIER={multiplier}\nCPI_DIVISOR={divisor}', file=out)
          print(f'{cpi} CPI: sensor {sensor_cpi}, cursor multiplier {multiplier}/{divisor}')
          PY
      - name: Set up the ZMK workspace
        run: |
          mkdir /tmp/roba-zmk
          cp -R config /tmp/roba-zmk/config
          cd /tmp/roba-zmk
          west init -l config
          west update --fetch-opt=--filter=tree:0
          if [ "$CPI_MULTIPLIER" != "$CPI_DIVISOR" ]; then
            python3 - <<'PY'
          from pathlib import Path

          scaler = Path('zmk/app/src/pointing/input_processor_scaler.c')
          contents = scaler.read_text()
          # PMW3610 can combine two 12-bit samples in an event. Keep the product wide
          # enough for the reduced CPI ratio and the remainder carried from the last event.
          narrow = 'int16_t value_mul = event->value * (int16_t)mul;'
          wide = 'int32_t value_mul = event->value * (int32_t)mul;'
          if contents.count(narrow) == 1 and wide not in contents:
              scaler.write_text(contents.replace(narrow, wide))
          elif contents.count(wide) != 1 or narrow in contents:
              raise SystemExit('The ZMK scaler arithmetic changed. Recheck its accumulator width.')
          PY
          fi
          west zephyr-export
      - name: Build and verify right-side firmware
        env:
          TARGET_CPI: ${{ inputs.cpi }}
        working-directory: /tmp/roba-zmk
        run: |
          west build -s zmk/app -d build -b seeeduino_xiao_ble -S studio-rpc-usb-uart -- \
            -DZMK_CONFIG=/tmp/roba-zmk/config -DSHIELD=roBa_R -DZMK_EXTRA_MODULES="$GITHUB_WORKSPACE"
          if [ "$CPI_MULTIPLIER" != "$CPI_DIVISOR" ]; then
            multiplier_hex="$(printf '0x%x' "$CPI_MULTIPLIER")"
            divisor_hex="$(printf '0x%x' "$CPI_DIVISOR")"
            grep -E "input-processors = <[[:space:]]*&zip_xy_scaler[[:space:]]+(${multiplier_hex}|${CPI_MULTIPLIER})[[:space:]]+(${divisor_hex}|${CPI_DIVISOR})[[:space:]]*>" build/zephyr/zephyr.dts
          fi
          grep -Fx "CONFIG_PMW3610_CPI=$SENSOR_CPI" build/zephyr/.config
          cp build/zephyr/zmk.uf2 "$GITHUB_WORKSPACE/roBa_R-$TARGET_CPI.uf2"
      - uses: actions/upload-artifact@v4
        with:
          name: roBa_R-${{ inputs.cpi }}
          path: roBa_R-${{ inputs.cpi }}.uf2
          if-no-files-found: error
